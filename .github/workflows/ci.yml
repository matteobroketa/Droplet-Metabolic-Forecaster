name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run Node regression suite
        run: npm test
      - name: Run browser verification
        run: npm run test:browser
      - name: Rebuild standalone artifact
        run: npm run build
      - name: Verify release artifact
        run: npm run verify:artifact
      - name: Verify audit manifest
        run: npm run verify:manifest
      - name: Require clean tracked tree after rebuild
        run: git diff --exit-code
